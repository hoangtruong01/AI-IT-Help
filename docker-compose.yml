# ==============================
# EOMP — Docker Compose
# ==============================
# Infrastructure services for development environment.
# Application service containers will be added in later steps.

name: eomp

services:
  # ==============================
  # PostgreSQL
  # ==============================
  postgres:
    image: postgres:17-alpine
    container_name: eomp-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eomp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eomp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eomp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eomp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # Redis
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: eomp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # RabbitMQ
  # ==============================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: eomp-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eomp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eomp_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # MinIO (Object Storage)
  # ==============================
  minio:
    image: minio/minio:latest
    container_name: eomp-minio
    restart: unless-stopped
    ports:
      - "${MINIO_ENDPOINT_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eomp_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-eomp_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # Qdrant (Vector Database)
  # ==============================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eomp-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # Prometheus (Metrics)
  # ==============================
  prometheus:
    image: prom/prometheus:latest
    container_name: eomp-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eomp-network

  # ==============================
  # Grafana (Dashboards)
  # ==============================
  grafana:
    image: grafana/grafana:latest
    container_name: eomp-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-eomp_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - eomp-network

  # ==============================
  # Loki (Log Aggregation)
  # ==============================
  loki:
    image: grafana/loki:latest
    container_name: eomp-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - eomp-network

# ==============================
# Networks
# ==============================
networks:
  eomp-network:
    driver: bridge
    name: eomp-network

# ==============================
# Volumes
# ==============================
volumes:
  postgres_data:
    name: eomp-postgres-data
  redis_data:
    name: eomp-redis-data
  rabbitmq_data:
    name: eomp-rabbitmq-data
  minio_data:
    name: eomp-minio-data
  qdrant_data:
    name: eomp-qdrant-data
  prometheus_data:
    name: eomp-prometheus-data
  grafana_data:
    name: eomp-grafana-data
  loki_data:
    name: eomp-loki-data
