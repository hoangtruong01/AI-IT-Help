openapi: 3.0.3
info:
  title: EOMP API
  version: 0.1.0
  description: |
    Runtime operation baseline for the EOMP gateway and its downstream services.
    All 101 registered `/api/v1` operations are represented. Generic write bodies
    mark endpoints whose domain schemas still need richer component definitions.
  x-coverage-status: complete-operation-inventory
  x-runtime-operation-count: 101
  x-documented-operation-count: 101
servers:
  - url: http://localhost:8080
    description: Local gateway
security:
  - BearerAuth: []

