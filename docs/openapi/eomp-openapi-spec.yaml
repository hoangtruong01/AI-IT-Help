components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    TicketId: {name: ticketId, in: path, required: true, schema: {type: string}}
    AssetId: {name: assetId, in: path, required: true, schema: {type: string}}
  responses:
    Success: {description: Successful response}
    Created: {description: Resource created}
    Unauthorized: {description: Authentication failed}
    Conflict: {description: Optimistic-lock or uniqueness conflict}
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    VersionedBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: {type: integer, minimum: 1}
            additionalProperties: true
    ApprovalDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision: {type: string, enum: [APPROVED, REJECTED]}
              notes: {type: string}
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: {type: string, format: email}
              password: {type: string}
    Register:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, full_name]
            properties:
              email: {type: string, format: email}
              password: {type: string, minLength: 12, maxLength: 72}
              full_name: {type: string}
              department_id: {type: string, nullable: true}
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refresh_token]
            properties:
              refresh_token: {type: string}
