        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

  workflow:
    enabled: true
    image: eomp/workflow:latest
    port: 8085
    replicas: 2
    dbName: workflow_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  notification:
    enabled: true
    image: eomp/notification:latest
    port: 8086
    replicas: 2
    dbName: notification_db
