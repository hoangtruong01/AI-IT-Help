# ==============================================================================
# EOMP — Production Helm Chart Default Values
# ==============================================================================

global:
  environment: production
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  timezone: UTC

# --- Core Secrets ---
secrets:
  postgresPassword: "eomp_production_secure_db_pass_2026"
  jwtSecret: "eomp_production_super_secure_jwt_secret_key_2026"
  rabbitmqUser: "eomp"
  rabbitmqPassword: "eomp_production_rabbitmq_pass_2026"
  minioAccessKey: "eomp_minio_admin"
  minioSecretKey: "eomp_minio_production_secret_2026"
  grafanaAdminUser: "admin"
  grafanaAdminPassword: "eomp_grafana_secure_admin_pass_2026"

# --- Ingress Configuration ---
ingress:
  enabled: true
  className: nginx
  host: eomp.local
  tls: []
  # - secretName: eomp-tls-secret
  #   hosts:
  #     - eomp.local

# --- Microservices Declarations ---
services:
  gateway:
    enabled: true
    image: eomp/gateway:latest
    port: 8080
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

  auth:
    enabled: true
    image: eomp/auth:latest
    port: 8081
    replicas: 2
    dbName: auth_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  employee:
    enabled: true
    image: eomp/employee:latest
    port: 8082
    replicas: 2
    dbName: employee_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  asset:
    enabled: true
    image: eomp/asset:latest
    port: 8083
    replicas: 2
    dbName: asset_db
    hpa:
      enabled: true
      minReplicas: 2
