# ==============================================================================
# EOMP — Production Helm Chart Default Values
# ==============================================================================

global:
  environment: production
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  timezone: UTC

# --- Core Secrets ---
secrets:
  create: false
  existingSecret: eomp-secrets
  postgresPassword: ""
  jwtSecret: ""
  auditHmacKey: ""
  openaiApiKey: ""
  geminiApiKey: ""
  rabbitmqUser: ""
  rabbitmqPassword: ""
  minioAccessKey: ""
  minioSecretKey: ""
  grafanaAdminUser: ""
  grafanaAdminPassword: ""

# --- Ingress Configuration ---
ingress:
  enabled: true
  className: nginx
  host: eomp.local
  tls: []
  # - secretName: eomp-tls-secret
  #   hosts:
  #     - eomp.local

# --- Microservices Declarations ---
services:
  gateway:
    enabled: true
    image: eomp/gateway:0.1.0
    port: 8080
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

  auth:
    enabled: true
    image: eomp/auth:0.1.0
    port: 8081
    replicas: 2
    dbName: auth_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  employee:
    enabled: true
    image: eomp/employee:0.1.0
    port: 8082
    replicas: 2
    dbName: employee_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  asset:
    enabled: true
    image: eomp/asset:0.1.0
    port: 8083
    replicas: 2
    dbName: asset_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  helpdesk:
    enabled: true
    image: eomp/helpdesk:0.1.0
    port: 8084
    replicas: 2
    dbName: helpdesk_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

  workflow:
    enabled: true
    image: eomp/workflow:0.1.0
    port: 8085
    replicas: 2
    dbName: workflow_db
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  notification:
    enabled: true
    image: eomp/notification:0.1.0
    port: 8086
    replicas: 2
    dbName: notification_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  knowledge:
    enabled: true
    image: eomp/knowledge:0.1.0
    port: 8087
    replicas: 2
    dbName: knowledge_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ai:
    enabled: true
    image: eomp/ai:0.1.0
    port: 8088
    replicas: 2
    provider: openai
    allowMock: false
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  audit:
    enabled: true
    image: eomp/audit:0.1.0
    port: 8089
    replicas: 2
    dbName: audit_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  reporting:
    enabled: true
    image: eomp/reporting:0.1.0
    port: 8090
    replicas: 2
    dbName: reporting_db
    hpa:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

  web:
    enabled: true
    image: eomp/web:0.1.0
    port: 3000
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# --- Infrastructure Components ---
infrastructure:
  postgres:
    enabled: true
    image: postgres:17.2-alpine3.21
    storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  redis:
    enabled: true
    image: redis:7.4.2-alpine
    storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  rabbitmq:
    enabled: true
    image: rabbitmq:4.0.5-management-alpine
    storage: 10Gi
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 800m
        memory: 1Gi

  minio:
    enabled: true
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    storage: 50Gi
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.13.2
    storage: 20Gi
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  prometheus:
    enabled: true
    image: prom/prometheus:v3.1.0
    storage: 30Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  grafana:
    enabled: true
    image: grafana/grafana:11.5.1
    storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  loki:
    enabled: true
    image: grafana/loki:3.4.1
    storage: 30Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
