# --- Infrastructure Components ---
infrastructure:
  postgres:
    enabled: true
    image: postgres:17-alpine
    storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  redis:
    enabled: true
    image: redis:7-alpine
