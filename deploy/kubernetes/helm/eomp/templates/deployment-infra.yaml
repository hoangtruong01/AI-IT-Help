{{- if .Values.infrastructure.minio.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eomp.fullname" . }}-minio
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.infrastructure.minio.image }}
          command: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" . }}
                  key: MINIO_SECRET_KEY
          resources:
            {{- toYaml .Values.infrastructure.minio.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "eomp.fullname" . }}-minio-pvc
{{- end }}

