{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eomp.fullname" . }}-ingress
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Nuxt Cookie BFF Route
          - path: /api/auth/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eomp.fullname" . }}-web
                port:
                  number: 3000
          # API Gateway Route
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eomp.fullname" . }}-gateway
                port:
                  number: 8080
          # Frontend Web Route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "eomp.fullname" . }}-web
                port:
                  number: 3000
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
