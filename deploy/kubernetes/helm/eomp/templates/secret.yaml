{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eomp.secretName" . }}
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  AUDIT_HMAC_KEY: {{ required "secrets.auditHmacKey is required when secrets.create=true" .Values.secrets.auditHmacKey | quote }}
  {{ if eq .Values.services.ai.provider "openai" }}
  OPENAI_API_KEY: {{ required "secrets.openaiApiKey is required for the OpenAI provider" .Values.secrets.openaiApiKey | quote }}
  {{ else if eq .Values.services.ai.provider "gemini" }}
  GEMINI_API_KEY: {{ required "secrets.geminiApiKey is required for the Gemini provider" .Values.secrets.geminiApiKey | quote }}
  {{ end }}
  RABBITMQ_USER: {{ required "secrets.rabbitmqUser is required when secrets.create=true" .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword is required when secrets.create=true" .Values.secrets.rabbitmqPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey is required when secrets.create=true" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey is required when secrets.create=true" .Values.secrets.minioSecretKey | quote }}
  GRAFANA_ADMIN_USER: {{ required "secrets.grafanaAdminUser is required when secrets.create=true" .Values.secrets.grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ required "secrets.grafanaAdminPassword is required when secrets.create=true" .Values.secrets.grafanaAdminPassword | quote }}
{{- end }}
