{{- range $svcName, $svcConfig := .Values.services }}
{{- if $svcConfig.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eomp.fullname" $ }}-{{ $svcName }}
  labels:
    {{- include "eomp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{ $svcName }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svcConfig.port }}
      targetPort: {{ $svcConfig.port }}
{{- end }}
{{- end }}

{{- if .Values.infrastructure.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eomp.fullname" . }}-postgres
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}

{{- if .Values.infrastructure.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eomp.fullname" . }}-redis
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}

{{- if .Values.infrastructure.rabbitmq.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eomp.fullname" . }}-rabbitmq
  labels:
    {{- include "eomp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
