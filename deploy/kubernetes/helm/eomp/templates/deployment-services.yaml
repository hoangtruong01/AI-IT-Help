{{- range $svcName, $svcConfig := .Values.services }}
{{- if $svcConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eomp.fullname" $ }}-{{ $svcName }}
  labels:
    {{- include "eomp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  replicas: {{ $svcConfig.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $svcName }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $svcName }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: {{ $svcName }}
          image: {{ $svcConfig.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svcConfig.port }}
          {{- if eq $svcName "gateway" }}
          envFrom:
            - configMapRef:
                name: {{ include "eomp.fullname" $ }}-global-config
            - configMapRef:
                name: {{ include "eomp.fullname" $ }}-gateway-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: JWT_SECRET
          {{- else if eq $svcName "web" }}
          envFrom:
            - configMapRef:
                name: {{ include "eomp.fullname" $ }}-web-config
          {{- else }}
          env:
            - name: APP_ENV
              value: {{ $.Values.global.environment | quote }}
            - name: PORT
              value: {{ $svcConfig.port | quote }}
            {{- if $svcConfig.dbName }}
            - name: POSTGRES_HOST
              value: "{{ include "eomp.fullname" $ }}-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "eomp"
            - name: {{ printf "%s_DB_NAME" (upper $svcName) }}
              value: {{ $svcConfig.dbName | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if eq $svcName "auth" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: JWT_SECRET
            {{- end }}
            {{- if has $svcName (list "asset" "helpdesk" "workflow" "notification" "audit") }}
            - name: RABBITMQ_HOST
              value: "{{ include "eomp.fullname" $ }}-rabbitmq"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: RABBITMQ_PASSWORD
            {{- end }}
            {{- if eq $svcName "audit" }}
            - name: AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: AUDIT_HMAC_KEY
            {{- end }}
            {{- if eq $svcName "knowledge" }}
            - name: QDRANT_URL
              value: "http://{{ include "eomp.fullname" $ }}-qdrant:6333"
            {{- else if eq $svcName "ai" }}
            - name: AI_PROVIDER
              value: {{ $svcConfig.provider | quote }}
            - name: ALLOW_MOCK_AI
              value: {{ $svcConfig.allowMock | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eomp.secretName" $ }}
                  key: GEMINI_API_KEY
                  optional: true
            - name: QDRANT_URL
              value: "http://{{ include "eomp.fullname" $ }}-qdrant:6333"
            - name: QDRANT_HOST
              value: "{{ include "eomp.fullname" $ }}-qdrant"
            - name: QDRANT_PORT
              value: "6333"
            - name: KNOWLEDGE_SERVICE_URL
              value: "http://{{ include "eomp.fullname" $ }}-knowledge:8087"
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ if eq $svcName "web" }}/{{ else }}/health{{ end }}
              port: {{ $svcConfig.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ if eq $svcName "web" }}/{{ else if $svcConfig.dbName }}/ready{{ else }}/health{{ end }}
              port: {{ $svcConfig.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $svcConfig.resources | nindent 12 }}
{{- end }}
{{- end }}
