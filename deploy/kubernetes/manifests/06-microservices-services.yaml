# ==============================================================================
# EOMP — Kubernetes ClusterIP Services for Microservices
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: eomp
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
