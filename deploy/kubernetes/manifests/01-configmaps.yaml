apiVersion: v1
kind: ConfigMap
metadata:
  name: eomp-global-config
  namespace: eomp
  labels:
    app.kubernetes.io/name: eomp
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  TZ: "UTC"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "eomp"
  REDIS_ADDR: "redis-service:6379"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  MINIO_ENDPOINT: "minio-service:9000"
  QDRANT_URL: "http://qdrant-service:6333"
  PROMETHEUS_URL: "http://prometheus-service:9090"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eomp-gateway-config
  namespace: eomp
data:
  PORT: "8080"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  EMPLOYEE_SERVICE_URL: "http://employee-service:8082"
  ASSET_SERVICE_URL: "http://asset-service:8083"
  HELPDESK_SERVICE_URL: "http://helpdesk-service:8084"
  WORKFLOW_SERVICE_URL: "http://workflow-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  KNOWLEDGE_SERVICE_URL: "http://knowledge-service:8087"
  AI_SERVICE_URL: "http://ai-service:8088"
  AUDIT_SERVICE_URL: "http://audit-service:8089"
  REPORTING_SERVICE_URL: "http://reporting-service:8090"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eomp-web-config
  namespace: eomp
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  NUXT_PUBLIC_API_BASE_URL: "/api/v1"
